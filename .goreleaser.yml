version: 2

project_name: dntproxy

before:
  hooks:
    - cmd: bun install
      dir: ui
    - cmd: bun run build
      dir: ui

builds:
  - id: dntproxy
    main: ./cmd/dntproxy/
    binary: dntproxy
    ldflags:
      - -s -w -X github.com/dungnt/dntproxy/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - dntproxy
    # Matches install.sh / install.ps1 naming: dntproxy-{os}-{arch}.tar.gz / .zip
    name_template: "dntproxy-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - config.example.json

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: dungnt1312
    name: dntproxy
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Tag}}"
